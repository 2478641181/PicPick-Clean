name: Build PicPick

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: 编译 Release
        run: |
          xcodebuild build \
            -project PicPick.xcodeproj \
            -scheme PicPick \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: 打包 IPA
        run: |
          APP=$(find ./build -name "PicPick.app" -type d | head -1)
          echo "📦 App: $APP"

          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r PicPick.ipa Payload/

          echo "✅ 完成"
          ls -lh PicPick.ipa
          unzip -l PicPick.ipa | head -20

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: PicPick-IPA
          path: PicPick.ipa
          retention-days: 30
