name: Build PicPick IPA

on:
  push:
    branches: [main, release]
  workflow_dispatch:
    inputs:
      export_method:
        description: '导出方式'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - ad-hoc
          - app-store
          - enterprise

jobs:
  build:
    runs-on: macos-14  # M1 芯片，编译更快

    steps:
      # ========== 拉取代码 ==========
      - name: 拉取代码
        uses: actions/checkout@v4

      # ========== 选择 Xcode 版本 ==========
      - name: 选择 Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      # ========== 配置签名证书 ==========
      - name: 创建临时钥匙串并导入证书
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          # 创建临时钥匙串
          KEYCHAIN_PATH=$RUNNER_TEMP/picpick-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # 导入 P12 证书
          CERT_PATH=$RUNNER_TEMP/cert.p12
          echo -n "$P12_BASE64" | base64 --decode > $CERT_PATH
          security import $CERT_PATH \
            -k $KEYCHAIN_PATH \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign

          # 允许 codesign 访问钥匙串
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # 设置默认钥匙串
          security list-keychains -d user -s $KEYCHAIN_PATH

      # ========== 安装描述文件 ==========
      - name: 安装描述文件
        env:
          PROVISION_PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo -n "$PROVISION_PROFILE_BASE64" | base64 --decode \
            > "$PROFILE_DIR/profile.mobileprovision"
          echo "✅ 描述文件已安装"

      # ========== 验证签名 ==========
      - name: 验证签名配置
        run: |
          echo "=== 可用签名证书 ==="
          security find-identity -v -p codesigning
          echo "=== 描述文件 ==="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/"

      # ========== Archive ==========
      - name: 编译 Archive
        run: |
          xcodebuild archive \
            -project PicPick.xcodeproj \
            -scheme PicPick \
            -configuration Release \
            -archivePath $RUNNER_TEMP/PicPick.xcarchive \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Development" \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.PROVISION_PROFILE_NAME }}" \
            PRODUCT_BUNDLE_IDENTIFIER="${{ secrets.BUNDLE_ID }}"

      # ========== 导出 IPA ==========
      - name: 导出 IPA
        env:
          EXPORT_METHOD: ${{ github.event.inputs.export_method || 'development' }}
        run: |
          # 生成导出配置
          cat > $RUNNER_TEMP/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>$EXPORT_METHOD</string>
              <key>teamID</key>
              <string>${{ secrets.TEAM_ID }}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Development</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${{ secrets.BUNDLE_ID }}</key>
                  <string>${{ secrets.PROVISION_PROFILE_NAME }}</string>
              </dict>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/PicPick.xcarchive \
            -exportPath $RUNNER_TEMP/ipa-output \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist

      # ========== 显示结果 ==========
      - name: 打包结果
        run: |
          echo "========== 打包完成 =========="
          ls -lh $RUNNER_TEMP/ipa-output/
          echo ""
          # 显示 IPA 信息
          IPA_FILE=$(find $RUNNER_TEMP/ipa-output -name "*.ipa" | head -1)
          if [ -f "$IPA_FILE" ]; then
            echo "📦 IPA: $(basename $IPA_FILE)"
            echo "📏 大小: $(du -h "$IPA_FILE" | cut -f1)"
          fi

      # ========== 上传产物 ==========
      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: PicPick-${{ github.sha }}
          path: ${{ runner.temp }}/ipa-output/*.ipa
          retention-days: 30  # 保留 30 天

      # ========== 上传 dSYM（用于崩溃分析）==========
      - name: 上传 dSYM
        uses: actions/upload-artifact@v4
        with:
          name: PicPick-dSYM-${{ github.sha }}
          path: ${{ runner.temp }}/PicPick.xcarchive/dSYMs/*
          retention-days: 30

      # ========== 清理 ==========
      - name: 清理钥匙串
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/picpick-signing.keychain-db 2>/dev/null || true
